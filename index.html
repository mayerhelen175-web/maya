<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maya Bedtime Stories</title>
<script>/* Story API endpoint (Vercel function api/story.js). Empty = demo uses sample stories only. */ window.MAYA_API = window.MAYA_API || '';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column on phones (tab bar at the bottom), a top-nav web app with a two-column home on wide screens. Watercolor only where the story lives. */
:root{
  --bg:#F7F1E8; --surface:#FFFFFF; --line:#E2D7C9; --fg:#2A2230; --sub:#5E5466;
  --accent:#5B3E7A; --accent-ink:#FFFFFF; --accent-soft:#EFE6F4; --clay:#9A5530; --danger:#9A3B2A;
  --chip:#ECE3D7; --warn:#FFF3DF; --scrim:rgba(42,34,48,.45); --rest:#15121A; --rest-fg:#D8CFE2;
  --w-blue:#A9C4DD; --w-lilac:#C9B7DA; --w-sage:#B5CDAE; --w-sun:#F2D68A; --w-rose:#EBB3A6; --w-op:.5;
  --n1:#4A5B86; --n2:#6A6FA0; --n3:#8790BC; --moon:#F7E8C4; --glow:#F2D68A;
  --f-display:'Lora', Georgia, 'Times New Roman', serif;
  --f-body:'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r:16px; --r-lg:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1822; --surface:#26202E; --line:#3A3245; --fg:#F1EAF4; --sub:#BFB4C9;
  --accent:#C9AAE8; --accent-ink:#1C1822; --accent-soft:#30273F; --clay:#E3A57E; --danger:#F29482;
  --chip:#2F2838; --warn:#3A2F1E; --scrim:rgba(0,0,0,.55); --w-op:.28; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1822; --surface:#26202E; --line:#3A3245; --fg:#F1EAF4; --sub:#BFB4C9;
  --accent:#C9AAE8; --accent-ink:#1C1822; --accent-soft:#30273F; --clay:#E3A57E; --danger:#F29482;
  --chip:#2F2838; --warn:#3A2F1E; --scrim:rgba(0,0,0,.55); --w-op:.28; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(24px,4vw,34px)} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* chrome */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:26px;color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.topnav{display:none;gap:4px;flex:1 1 auto}
.topnav button{height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--sub);cursor:pointer}
.topnav button.on{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;color:var(--fg)}
.helpbtn{height:38px;padding:0 14px;border-radius:19px;border:0;background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;cursor:pointer}
.demo{max-width:1120px;margin:10px auto 0;padding-inline:16px}
.demo span{display:block;font-size:12px;color:var(--sub);background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;min-height:50px;border:0;background:transparent;color:var(--sub);font-size:11px;font-weight:600;cursor:pointer;padding-top:4px}
.tabbar button.on{color:var(--accent)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.narrow{max-width:620px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--fg)}
.head{display:flex;align-items:center;gap:12px}
.head .t{display:flex;flex-direction:column;min-width:0}
.muted{color:var(--sub)} .small{font-size:13px} .tiny{font-size:12px}
.label{font-size:13px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--clay)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn[disabled]{background:var(--chip);color:var(--sub);cursor:not-allowed}
.btn.full{width:100%}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.line{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.chip{min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:4px;background:var(--chip);border-radius:14px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:13px;color:var(--sub);cursor:pointer;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.45;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex-shrink:0;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.input{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt.on{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--accent-soft);font-size:13px;line-height:1.45}
.warnbox{padding:12px 14px;border-radius:14px;background:var(--warn);font-size:13px;line-height:1.45}

/* tiles */
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:118px}
.tile .dot{position:absolute;right:-8px;top:-8px;width:56px;height:56px}
.tile b{font-family:var(--f-display);font-size:18px;font-weight:600;position:relative}
.tile span{position:relative}
.wash{opacity:var(--w-op)}
.washwrap{position:relative;padding:14px}
.washwrap>svg.bgwash{position:absolute;inset:0;width:100%;height:100%}
.washwrap>.inner{position:relative}

/* home */
.homegrid{display:grid;gap:20px}
.libitem{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}

/* reader */
.readwrap{display:grid;gap:18px}
.page-en{font-family:var(--f-display);font-size:18px;line-height:1.6;max-width:62ch}
.page-es{font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1.6;color:var(--sub);padding-left:12px;border-left:2px solid var(--w-lilac);max-width:62ch}
.player{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:32px;background:var(--accent);color:var(--accent-ink)}
.player .pbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;font-size:14px;line-height:1.5;border-radius:18px}
.bub.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1 1 auto;min-width:0;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:15px}
.sendb{width:48px;height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* overlays */
.sheetback{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rest{position:fixed;inset:0;z-index:30;background:var(--rest);color:var(--rest-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.rest .chip{background:transparent;color:var(--rest-fg);border-color:#4A4258}
.rest .chip.on{background:#3A3346;border-color:#3A3346;color:#F1EAF4}

/* kid mode */
.kid{position:fixed;inset:0;z-index:15;background:#DCE3EE;overflow:hidden}
.kid .hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.kid .hud .p{height:48px;padding:0 16px;border-radius:24px;background:#FFFFFF;color:#2A2230;display:flex;align-items:center;gap:8px;font-weight:700}
.kid .exit{width:48px;height:48px;border-radius:24px;border:0;background:#FFFFFF;color:#5B3E7A;display:flex;align-items:center;justify-content:center;cursor:pointer}
.kid .star{position:absolute;width:72px;height:72px;border:0;background:transparent;cursor:pointer;padding:0;border-radius:36px;z-index:2}
.kid .msg{position:absolute;left:16px;right:16px;bottom:calc(30px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:20px;border-radius:24px;background:#FFFFFF;color:#2A2230;text-align:center;z-index:3}
.kid h2{color:#2A2230}

.gen{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.gen .step{display:flex;gap:10px;align-items:center;font-weight:600}
.gen .tick{width:22px;height:22px;border-radius:11px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.gen .tick.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:12px;color:var(--sub)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.daybtn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);padding:0}
.daybtn.s{background:var(--accent-soft);border-color:var(--w-rose)}
.daybtn.t{background:var(--accent-soft);border-color:var(--w-lilac)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;font-weight:600;font-size:14px}
.setrow:first-child{border-top:0}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

@media (min-width:860px){
  .topnav{display:flex}
  .tabbar{display:none}
  main{padding-block:28px 48px}
  .homegrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
  .readwrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
</style>

</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="5"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  </defs>
</svg>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- state ---------- */
var S = {
  route:'welcome', onboarded:false,
  consent:{adult:false,terms:false,ai:false,news:false},
  child:{name:'Mila',age:'4',pron:'she',fam:['Mom','Grandma'],langs:['English','Spanish'],coppa:false},
  hero:{tone:4,det:['Freckles','Curly hair']},
  story:{cat:'fears',ti:0,mood:'night',fmt:'story',langs:['English','Spanish'],lay:'both'},
  current:'dark', generating:false, genStep:0,
  reader:{p:0,lang:'both',playing:false,audio:false,timer:'15'},
  film:{k:0,sub:'en'},
  book:{sel:['dark','teeth'],ed:'bi',checked:0,agree:false},
  pause:{tab:'lib',sit:'tantrum',log:null},
  brk:{act:'stars',t:'15',near:false},
  game:{got:[],end:0},
  lock:{res:''},
  stars:{grid:[[1,1,2,1,1,0,0],[2,1,1,2,1,0,0],[1,0,1,1,2,0,0],[2,2,1,0,1,0,0]]},
  pass:{plan:'3',ch:['Email'],card:false},
  helper:{log:null},
  fam:{keep:'30',state:'CA',tg:{pass:true,sms:false,ideas:false}},
  sheet:null
};
try{ var saved = JSON.parse(localStorage.getItem('maya-demo')||'null'); if(saved && saved.onboarded){ S.onboarded=true; S.route='home'; S.child=saved.child||S.child; S.hero=saved.hero||S.hero; S.consent={adult:true,terms:true,ai:true,news:false}; S.child.coppa=true; } }catch(e){}
function persist(){ try{ localStorage.setItem('maya-demo', JSON.stringify({onboarded:S.onboarded,child:S.child,hero:S.hero})); }catch(e){} }

/* ---------- helpers ---------- */
function getP(k){ return k.split('.').reduce(function(o,p){return o[p];},S); }
function setP(k,v){ var a=k.split('.'), o=S; for(var i=0;i<a.length-1;i++) o=o[a[i]]; o[a[a.length-1]]=v; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function name(){ var n=(S.child.name||'').trim(); return esc(n||'your hero'); }
var PR = {she:['she','her','her'],he:['he','him','his'],they:['they','them','their']};
function fill(t){ var p=PR[S.child.pron]||PR.she; return t.replace(/\{N\}/g,name()).replace(/\{HERO\}/g,name()).replace(/\{S\}/g,p[0]).replace(/\{O\}/g,p[1]).replace(/\{P\}/g,p[2]); }
var LCODE={English:'en',Spanish:'es',Russian:'ru'}, LNAME={en:'English',es:'Español',ru:'Русский'}, LVOICE={en:'en-US',es:'es-US',ru:'ru-RU'};
/* Languages a story is shown in: AI stories carry their own; samples exist in en/es. */
function stLangs(st){ if(st.langs) return st.langs; return S.story.langs.indexOf('Spanish')>=0?['en','es']:['en']; }
function chip(label,on,k,v,act){ return '<button type="button" class="chip'+(on?' on':'')+'" aria-pressed="'+on+'" data-act="'+(act||'set')+'" data-k="'+k+'" data-v="'+esc(v)+'">'+label+'</button>'; }
function seg(items,cur,k){ return '<div class="seg">'+items.map(function(it){var on=it[0]===cur;return '<button type="button" class="'+(on?'on':'')+'" aria-pressed="'+on+'" data-act="set" data-k="'+k+'" data-v="'+it[0]+'">'+it[1]+'</button>';}).join('')+'</div>'; }
function check(id,k,text){ var v=getP(k); return '<label class="check" for="'+id+'"><input type="checkbox" id="'+id+'" data-act="chk" data-k="'+k+'"'+(v?' checked':'')+'><span>'+text+'</span></label>'; }
function back(to,label){ return '<button type="button" class="back" data-go="'+to+'" aria-label="'+(label||'Back')+'"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>'; }
function head(to,title,sub){ return '<div class="head">'+back(to)+'<div class="t"><h1 style="font-size:24px">'+title+'</h1>'+(sub?'<span class="small muted">'+sub+'</span>':'')+'</div></div>'; }
var IC = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  book:'<path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>',
  clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  pause:'<path d="M9 6v12M15 6v12"/>',
  fam:'<circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c1-3.5 3.3-5 6-5s5 1.5 6 5M15 15c2.5 0 4.5 1.3 5.5 4"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  send:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  moon:'<path d="M20 13A8 8 0 1 1 11 4a6 6 0 0 0 9 9z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  cam:'<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  next:'<path d="M9 5l7 7-7 7"/>', prev:'<path d="M15 5l-7 7 7 7"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  screen:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'
};
function ic(n,sz){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"'+(sz?' style="width:'+sz+'px;height:'+sz+'px"':'')+'>'+IC[n]+'</svg>'; }
function dot(col){ return '<svg class="dot" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="22" class="wash" filter="url(#wash)" style="fill:var('+col+')"/></svg>'; }

/* ---------- illustrations ---------- */

function speak(texts){
  try{
    if(!('speechSynthesis' in window)) return false;
    speechSynthesis.cancel();
    texts.forEach(function(t){ var u=new SpeechSynthesisUtterance(t[0]); u.lang=t[1]; u.rate=0.9; u.onend=function(){ if(!speechSynthesis.speaking){ S.reader.playing=false; if(S.route==='reader') render(); } }; speechSynthesis.speak(u); });
    return true;
  }catch(e){ return false; }
}
function hush(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }

   +'<div class="row">'+[['book','Make a book'],['pass','How do passes work?'],['sms','Text me reminders']].map(function(q){return '<button type="button" class="chip" data-act="hquick" data-v="'+q[0]+'">'+q[1]+'</button>';}).join('')+'</div>'
   +'<button type="button" class="btn line full" data-act="sheet" data-v="share">'+ic('screen',18)+'Show my screen to Helper</button>'
   +'<form class="composer" data-form="helper"><label class="sr" for="help-msg">Message</label><input id="help-msg" placeholder="Ask about Maya…" autocomplete="off"><button type="submit" class="sendb" aria-label="Send">'+ic('send',20)+'</button></form>'
   +'<p class="tiny muted">Demo: Helper answers from a short script. The live agent connects later.</p></div>';
};

V.family = function(){
  var f=S.fam;
  function tg(k,label,sub){ return '<label class="setrow" for="tg-'+k+'"><span style="display:flex;flex-direction:column"><span>'+label+'</span><span class="tiny muted" style="font-weight:500">'+sub+'</span></span><input type="checkbox" id="tg-'+k+'" data-act="chk" data-k="fam.tg.'+k+'"'+(f.tg[k]?' checked':'')+' style="width:22px;height:22px;accent-color:var(--accent)"></label>'; }
  return '<div class="narrow stack">'+head('home','Family &amp; privacy')
   +'<div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--sub)">Children</span><div class="listcard"><button type="button" class="setrow" data-go="child"><span>'+name()+' · '+S.child.age+' · '+PR[S.child.pron][0]+'/'+PR[S.child.pron][1]+'</span><span style="color:var(--accent)">Edit</span></button><button type="button" class="setrow" data-act="toast" data-v="In the live site you can add up to 3 children."><span style="color:var(--accent)">+ Add a child (up to 3)</span></button></div></div>'
   +'<div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--sub)">What Maya keeps</span><div class="card stack small" style="gap:6px"><span><b>Kept:</b> your email, pass, the hero’s age, pronoun, interests and look, stories, star map.</span><span><b>Only on this device:</b> the hero’s name.</span><span><b>Never kept:</b> photos, voices, face data, location.</span></div></div>'
   +'<div class="field"><label class="label" for="state">Your state</label><select id="state" class="input" data-bind="fam.state">'+[['CA','California'],['NY','New York'],['TX','Texas'],['FL','Florida'],['IL','Illinois'],['NV','Nevada'],['WA','Washington']].map(function(s){return '<option value="'+s[0]+'"'+(s[0]===f.state?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select><span class="tiny muted">Some features follow state law. In Illinois and Nevada the Pause chat is off.</span></div>'
   +'<div class="field"><span class="label">Pause chat history</span>'+seg([['30','Keep 30 days'],['none','Don’t keep']],f.keep,'fam.keep')+'</div>'
   +'<div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--sub)">Messages from Maya</span><div class="listcard">'+tg('pass','Pass reminders by email','7 days, 1 day, last day')+tg('sms','Pass reminders by text','8 a.m. to 8 p.m. your time · reply STOP')+tg('ideas','Story ideas and news','Marketing. Off unless you turn it on')+'</div></div>'
   +'<div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--sub)">Your rights</span><div class="listcard">'
   +['My consents and when I gave them','Download all my data','Terms, refunds and arbitration'].map(function(t){return '<button type="button" class="setrow" data-act="toast" data-v="Demo: this opens in the live site."><span>'+t+'</span><span aria-hidden="true">›</span></button>';}).join('')
   +'<button type="button" class="setrow" data-act="reset"><span style="color:var(--danger)">Delete account and all data</span><span aria-hidden="true" style="color:var(--danger)">›</span></button></div><span class="tiny muted">Deleted within 30 days. Your downloaded files stay with you. In this demo, it resets the demo.</span></div>'
   +'</div>';
};

/* sheets */
function sheet(){
  if(!S.sheet) return '';
  var k=S.sheet, body='';
  if(k==='photo') body='<h2>Before you choose a photo</h2><ul><li>We only read hair, skin tone and glasses to fill in the builder.</li><li>The photo is deleted within seconds. No face data is created or stored.</li><li>Please use a photo of your own child, fully dressed.</li></ul>'
    +check('c-photo','sheetOk','I’m this child’s parent or guardian and I agree to this one-time photo use.')
    +'<div class="grid2"><button type="button" class="btn ghost" data-act="close">Not now</button><button type="button" class="btn" data-act="toast" data-v="Demo: photo matching connects in the live site."'+(S.sheetOk?'':' disabled')+'>Choose photo</button></div>';
  if(k==='dl') body='<h2>Save for your family</h2><p>This file is yours for personal, non-commercial use. Where you share it is your call. If it shows your child’s name or likeness, think it over before posting.</p><div class="grid2"><button type="button" class="btn ghost" data-act="toast" data-v="Demo: the live site saves an MP3.">Audio (MP3)</button><button type="button" class="btn ghost" data-act="toast" data-v="Demo: the live site saves a PDF.">Book (PDF)</button></div><button type="button" class="btn ghost" data-act="close">Cancel</button>';
  if(k==='share') body='<h2>Show your screen once?</h2><ul><li>Only this Maya tab, only for this session.</li><li>Payment fields and kid mode are always hidden.</li><li>It stops after 15 minutes or when you tap Stop.</li><li>Nothing is recorded.</li></ul><div class="grid2"><button type="button" class="btn ghost" data-act="close">Not now</button><button type="button" class="btn" data-act="toast" data-v="Demo: screen sharing connects with the live agent.">Start sharing</button></div>';
  if(k==='toast') body='<p style="font-weight:600">'+esc(S.toast)+'</p><button type="button" class="btn" data-act="close">OK</button>';
  return '<div class="sheetback" data-act="closeBack"><div class="sheet" role="dialog" aria-modal="true" aria-label="Details">'+body+'</div></div>';
}
function restLayer(){
  if(!(S.route==='reader'&&S.reader.audio)) return '';
  return '<div class="rest"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><circle cx="18" cy="22" r="14" fill="#3A3346"/><circle cx="24" cy="17" r="12" fill="#15121A"/></svg><h2 style="color:#E4DCEC">Screen is resting</h2><p style="max-width:300px">The story keeps playing. When it ends, everything goes quiet.</p><div class="row" style="justify-content:center">'
   +[['10','10 min'],['15','15 min'],['end','End of story']].map(function(t){return chip(t[1],S.reader.timer===t[0],'reader.timer',t[0]);}).join('')+'</div><button type="button" class="chip" data-act="audioOff">Show screen</button></div>';
}

/* chrome */
var NAV=[['home','Home','home'],['new','Stories','book'],['break','Break','clock'],['pause','Pause','pause'],['family','Family','fam']];
var NAVMAP={home:'home',new:'new',reader:'new',film:'new',book:'home',break:'break',pause:'pause',crisis:'pause',stars:'home',pass:'home',helper:'home',family:'family',hero:'home',child:'family'};
function chrome(inner){
  var full = S.route==='game';
  if(full) return inner;
  var onb = !S.onboarded;
  var cur = NAVMAP[S.route];
  var top = '<header class="topbar"><div class="in"><button type="button" class="logo" data-go="'+(onb?'welcome':'home')+'">Maya</button>'
    +(onb?'':'<nav class="topnav" aria-label="Main">'+NAV.map(function(n){return '<button type="button" class="'+(cur===n[0]?'on':'')+'" data-go="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>';}).join('')+'</nav>'
    +'<span style="margin-left:auto" class="row"><button type="button" class="pill" data-go="pass">Pass · 23 days</button><button type="button" class="helpbtn" data-go="helper">Help</button></span>')
    +'</div></header>';
  var demo='<div class="demo"><span>Demo site: sample stories and scripted replies. AI generation, payments and the live agent connect later.</span></div>';
  var tabs = onb?'':'<nav class="tabbar" aria-label="Main">'+NAV.map(function(n){return '<button type="button" class="'+(cur===n[0]?'on':'')+'" data-go="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+'<span>'+n[1]+'</span></button>';}).join('')+'</nav>';
  return top+demo+'<main id="main">'+inner+'</main>'+tabs;
}

var app=document.getElementById('app');
function render(){
  var v=V[S.route]||V.home;
  app.innerHTML = chrome(v())+sheet()+restLayer();
}
function go(r){
  if(!S.onboarded && ['welcome','child','hero','crisis'].indexOf(r)<0) r='welcome';
  if(S.route==='reader' && r!=='reader'){ hush(); S.reader.playing=false; S.reader.audio=false; }
  S.route=r; S.sheet=null; render();
  try{ if(location.hash!=='#'+r) history.replaceState(null,'','#'+r); }catch(e){}
  window.scrollTo(0,0);
}
function toast(msg){ S.toast=msg; S.sheet='toast'; render(); }

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act]'); if(!t) return;
  if(t.tagName==='INPUT') return;
  if(t.hasAttribute('data-go')){ e.preventDefault(); go(t.getAttribute('data-go')); return; }
  var a=t.getAttribute('data-act'), k=t.getAttribute('data-k'), v=t.getAttribute('data-v');
  if(a==='closeBack'){ if(e.target===t){ S.sheet=null; render(); } return; }
  e.preventDefault();
  switch(a){
    case 'set': setP(k,v); if(k==='story.cat') S.story.ti=0; break;
    case 'setn': setP(k,parseInt(v,10)); break;
    case 'tog': var arr=getP(k), i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); break;
    case 'tog2': var L=S.story.langs, j=L.indexOf(v); if(j>=0){ if(L.length>1) L.splice(j,1); } else { if(L.length>=2) L.shift(); L.push(v); } break;
    case 'signin': S.onboarded=true; S.consent={adult:true,terms:true,ai:true,news:false}; S.child.coppa=true; persist(); go('home'); return;
    case 'finishHero': S.onboarded=true; persist(); go('home'); return;
    case 'sheet': S.sheet=v; S.sheetOk=false; break;
    case 'close': S.sheet=null; break;
    case 'toast': toast(v); return;
    case 'open': S.current=v; S.reader={p:0,lang:'both',playing:false,audio:false,timer:'15'}; go('reader'); return;
    case 'generate':
      S.generating=true; S.genStep=0; render();
      var aiDone=null, aiWait=!!window.MAYA_API, finish=function(){ S.generating=false; var id=aiDone&&aiDone.id; if(!id){ id=CATS[S.story.cat].story; if(aiDone&&aiDone.fail) toast('Live AI story unavailable — showing a sample story.'); } S.current=id; S.reader={p:0,lang:S.story.lay==='one'?'0':'both',playing:false,audio:false,timer:'15'}; if(S.story.fmt==='film'){ S.film.k=0; go('film'); } else { go('reader'); if(S.story.fmt==='audio'){ S.reader.audio=true; startNarration(); render(); } } };
      if(aiWait) requestStory().then(function(id){ aiDone={id:id}; }, function(){ aiDone={fail:true}; });
      var tick=function(){ S.genStep++; if(S.route!=='new'){ S.generating=false; return; } if(S.genStep<3 || (aiWait&&!aiDone)){ S.genStep=Math.min(S.genStep,2); render(); setTimeout(tick,700); } else finish(); };
      setTimeout(tick,700); return;
    case 'page': var n=STORIES[S.current].pages.length; S.reader.p=Math.max(0,Math.min(n,S.reader.p+parseInt(v,10))); hush(); S.reader.playing=false; break;
    case 'play': if(S.reader.playing){ hush(); S.reader.playing=false; } else startNarration(); break;
    case 'audio': S.reader.audio=true; if(!S.reader.playing) startNarration(); break;
    case 'audioOff': S.reader.audio=false; break;
    case 'filmstep': S.film.k = S.film.k>=3?0:S.film.k+1; break;
    case 'review': S.book.checked=Math.min(S.book.sel.length*4,S.book.checked+4); break;
    case 'order': toast('Demo: in the live site this goes to checkout and the printer.'); return;
    case 'quick': pauseReply(v==='make'?'Yes, how to make up?':'I need to breathe', v==='make'?'Get down to eye level: “I yelled, and I’m sorry. I was upset about the juice, not you. Hug?” Kids learn that love comes back after a hard moment.':'Let’s do it together: in for 4, a tiny pause, out for 6. Three times. I’m here.'); return;
    case 'hquick':
      var R={book:['Make a book','Open Keepsakes → Printed book. Pick stories, review every page, then order. Nothing prints until every page is checked.'],pass:['How do passes work?','You pay once for 1, 3 or 12 months. When time’s up, access ends. No automatic charges, and your stories stay yours.'],sms:['Text me reminders','Turn on texts in Your pass. I’ll only text pass reminders, 8 a.m. to 8 p.m., and you can reply STOP anytime.']}[v];
      S.helper.log.push(['me',R[0]],['bot',R[1]]); break;
    case 'startGame': S.game={got:[],end:Date.now()+parseInt(S.brk.t,10)*60000}; go('game'); startClock(); return;
    case 'star': var gi=parseInt(v,10); if(S.game.got.indexOf(gi)<0) S.game.got.push(gi); break;
    case 'backToGame': S.lock.res=''; go('game'); startClock(); return;
    case 'lockans': if(v==='28'){ S.lock.res=''; stopClock(); go('home'); return; } S.lock.res='no'; break;
    case 'day': var g=S.stars.grid, hi=parseInt(k,10), di=parseInt(v,10); g[hi][di]=(g[hi][di]+1)%3; break;
    case 'buy': toast('Demo: in the live site this opens a one-time checkout. No subscription.'); return;
    case 'reset': try{ localStorage.removeItem('maya-demo'); }catch(err){} location.hash=''; location.reload(); return;
  }
  render();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-act')==='chk'){ var k=t.getAttribute('data-k'); if(k==='sheetOk') S.sheetOk=t.checked; else setP(k,t.checked); render(); var el=document.getElementById(t.id); if(el) el.focus(); }
  if(t.getAttribute('data-act')==='booktog'){ var id=t.getAttribute('data-v'), s=S.book.sel, i=s.indexOf(id); if(i>=0) s.splice(i,1); else s.push(id); S.book.checked=0; render(); }
  if(t.getAttribute('data-bind')==='fam.state'){ S.fam.state=t.value; render(); }
});
document.addEventListener('input',function(e){
  if(e.target.getAttribute('data-bind')==='child.name'){ S.child.name=e.target.value.slice(0,24); persist(); }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.getAttribute('data-form'), inp=e.target.querySelector('input'), txt=(inp.value||'').trim(); if(!txt) return;
  if(f==='pause'){
    if(CRISIS_RE.test(txt)){ S.pause.log.push(['me',txt],['crisis','I’m really glad you told me. You deserve support right now from a real person. Please call or text 988, or call 911 if anyone is in danger.']); render(); return; }
    pauseReply(txt,'Thank you for telling me. That sounds heavy. What feels hardest right now: the moment with your child, or how tired you are?'); return;
  }
  if(f==='helper'){ S.helper.log.push(['me',txt],['bot','Thanks! In this demo I answer only a few questions. Try the buttons above. The live helper connects later.']); render(); }
});
function pauseReply(me,bot){ S.pause.log.push(['me',me],['bot',bot]); render(); }
/* Live AI story: only structured, allowlisted fields go to the server. The child's name never leaves this device — the server writes {HERO}, filled in here. */
var aiN=0;
function requestStory(){
  var s=S.story, cat=CATS[s.cat], ctl=new AbortController(), to=setTimeout(function(){ ctl.abort(); },45000);
  var body={ age:parseInt(S.child.age,10)||4, pron:S.child.pron, cat:s.cat, topic:cat.items[s.ti], mood:s.mood,
    langs:s.langs.map(function(l){return LCODE[l];}).filter(Boolean).slice(0,2), family:(S.child.fam||[]).slice() };
  return fetch(window.MAYA_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})
    .then(function(r){ clearTimeout(to); if(!r.ok) throw new Error('status '+r.status); return r.json(); })
    .then(function(d){
      var st=(d&&d.story)||d; if(!st||!Array.isArray(st.pages)||!st.pages.length) throw new Error('bad story');
      var id='ai'+(++aiN);
      STORIES[id]={ ai:true, title:esc(st.title||cat.items[s.ti]), tag:cat.items[s.ti], mood:({night:'Bedtime',day:'Daytime',sos:'SOS'})[s.mood], scene:s.mood==='night'?'night':(s.cat==='feels'?'storm':'day'), langs:st.langs,
        pages:st.pages.map(function(p){ return p.map(function(t){ return esc(t||'').replace(/\n+/g,'<br>'); }); }),
        note:st.ritual?('Tonight’s ritual: '+st.ritual):'' , tip:st.parent_tip||'' };
      return id;
    });
}
function startNarration(){
  var st=STORIES[S.current], r=S.reader; if(r.p>=st.pages.length){ r.playing=false; return; }
  var pg=st.pages[r.p], SL=stLangs(st), two=SL.length>1, lang=two?r.lang:'0', q=[];
  if(lang!=='1') q.push([fill(pg[0]).replace(/<[^>]+>/g,''),LVOICE[SL[0]]]);
  if(lang!=='0'&&two) q.push([fill(pg[1]).replace(/<[^>]+>/g,''),LVOICE[SL[1]]]);
  r.playing = speak(q) || true;
}
var clockT=null;
function startClock(){ stopClock(); clockT=setInterval(function(){ if(S.route!=='game'){ return; } var left=Math.max(0,Math.round((S.game.end-Date.now())/1000)); var el=document.getElementById('clock'); if(left<=0){ stopClock(); render(); return; } if(el) el.textContent=Math.floor(left/60)+':'+('0'+(left%60)).slice(-2); },1000); }
function stopClock(){ if(clockT){ clearInterval(clockT); clockT=null; } }

/* boot */
var h=(location.hash||'').replace('#','');
if(h && V[h] && (S.onboarded || ['welcome','child','hero','crisis'].indexOf(h)>=0) && h!=='game' && h!=='lock') S.route=h;
render();
})();
</script>
